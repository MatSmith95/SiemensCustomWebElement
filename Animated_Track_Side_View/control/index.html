<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Animated Track Side View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles.css">

    <script src="./js/webcc.mock.js"></script>
    <script src="./js/webcc.min.js"></script>
</head>

<body>
    <main id="trackApp" class="track-app">
        <svg id="trackSvg" class="track-svg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet"
             role="img" aria-labelledby="trackTitle trackDescription">
            <title id="trackTitle">Animated track side view</title>
            <desc id="trackDescription">Side view of a continuous vehicle track with rotating wheels.</desc>

            <g id="wheelAssembly" class="wheel-assembly">
                <g class="wheel wheel-rear" data-wheel-pitch-radius="97" data-wheel-cx="145" data-wheel-cy="155"
                   transform="rotate(0 145 155)">
                    <circle class="wheel-tyre sprocket-tyre" cx="145" cy="155" r="69"></circle>
                    <circle class="wheel-rim" cx="145" cy="155" r="52"></circle>
                    <path class="wheel-spokes" d="M145 107V203M97 155H193M111 121L179 189M179 121L111 189"></path>
                    <circle class="wheel-hub" cx="145" cy="155" r="17"></circle>
                </g>

                <g class="wheel wheel-front" data-wheel-pitch-radius="97" data-wheel-cx="655" data-wheel-cy="155"
                   transform="rotate(0 655 155)">
                    <circle class="wheel-tyre sprocket-tyre" cx="655" cy="155" r="69"></circle>
                    <circle class="wheel-rim" cx="655" cy="155" r="52"></circle>
                    <path class="wheel-spokes" d="M655 107V203M607 155H703M621 121L689 189M689 121L621 189"></path>
                    <circle class="wheel-hub" cx="655" cy="155" r="17"></circle>
                </g>
            </g>

            <path id="trackGuide" class="track-guide"
                  d="M160 54 L640 54 C710 54 752 96 752 151 C752 207 711 247 650 247 L150 247 C89 247 48 207 48 151 C48 103 89 54 160 54 Z"></path>
            <path class="track-belt"
                  d="M164 66 L636 66 C700 66 740 101 740 151 C740 201 702 235 645 235 L155 235 C98 235 60 201 60 151 C60 108 99 66 164 66 Z"></path>
            <g id="treadAssembly" class="tread-assembly"></g>
        </svg>

        <div id="alarmBadge" class="alarm-badge">ALARM</div>
    </main>

    <script src="./code.js"></script>
</body>
</html>
