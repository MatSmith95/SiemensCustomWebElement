<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <title>MSDigitalJoystickV2</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='./styles.css' />

    <script src='./js/webcc.mock.js'></script>
    <script src='./js/webcc.min.js'></script>
</head>

<body>
    <main id='joystickApp'>
        <section class='joystick-card' aria-label='Digital analogue joystick'>
            <div id='joystickArea' class='joystick-area' role='application' aria-label='Joystick control'>
                <div class='direction-zone top-left' data-x='negative' data-y='positive'></div>
                <div class='direction-zone top-right' data-x='positive' data-y='positive'></div>
                <div class='direction-zone bottom-left' data-x='negative' data-y='negative'></div>
                <div class='direction-zone bottom-right' data-x='positive' data-y='negative'></div>
                <div id='verticalDeadband' class='deadband-guide vertical'></div>
                <div id='horizontalDeadband' class='deadband-guide horizontal'></div>
                <div class='limit-ring'></div>
                <span class='direction-arrow' data-x='negative' data-y='positive' aria-hidden='true'>&#8598;</span>
                <span class='direction-arrow' data-x='zero' data-y='positive' aria-hidden='true'>&#8593;</span>
                <span class='direction-arrow' data-x='positive' data-y='positive' aria-hidden='true'>&#8599;</span>
                <span class='direction-arrow' data-x='negative' data-y='zero' aria-hidden='true'>&#8592;</span>
                <span class='direction-arrow' data-x='positive' data-y='zero' aria-hidden='true'>&#8594;</span>
                <span class='direction-arrow' data-x='negative' data-y='negative' aria-hidden='true'>&#8601;</span>
                <span class='direction-arrow' data-x='zero' data-y='negative' aria-hidden='true'>&#8595;</span>
                <span class='direction-arrow' data-x='positive' data-y='negative' aria-hidden='true'>&#8600;</span>
                <div id='joystickKnob' class='joystick-knob'></div>
            </div>
        </section>
    </main>

    <script src='./code.js'></script>
</body>
</html>
